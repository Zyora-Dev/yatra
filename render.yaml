services:
  - type: pserv
    name: yatra-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python apply_schema.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: yatra-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        sync: false
      - key: AZURE_OPENAI_MODEL
        value: gpt-4.1
  - type: web
    name: yatra-web
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: frontend
    buildCommand: npm ci --include=dev && BACKEND_URL="http://$BACKEND_HOSTPORT" npm run build
    startCommand: BACKEND_URL="http://$BACKEND_HOSTPORT" npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BACKEND_HOSTPORT
        fromService:
          name: yatra-api
          type: pserv
          property: hostport

databases:
  - name: yatra-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: yatra
    user: yatra
    ipAllowList: []